<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="bagFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a63"/>
      <stop offset="1" stop-color="#a9793f"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- bag body -->
  <path d="M50 68
           C46 68 44 72 44 78
           L40 150
           C39 158 44 164 53 164
           L127 164
           C136 164 141 158 140 150
           L136 78
           C136 72 134 68 130 68
           Z"
        fill="url(#bagFill)" stroke="#7a5327" stroke-width="2.5"/>

  <!-- folded top -->
  <path d="M54 44 L126 44 L130 68 L50 68 Z"
        fill="#8a5a2b" stroke="#6b4420" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="58" y1="56" x2="122" y2="56" stroke="#6b4420" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- twine knot -->
  <circle cx="90" cy="44" r="6" fill="#5a3b1c"/>

  <!-- coffee beans -->
  <g fill="#3b2414">
    <ellipse cx="72" cy="100" rx="13" ry="9" transform="rotate(-25 72 100)"/>
    <ellipse cx="104" cy="112" rx="13" ry="9" transform="rotate(15 104 112)"/>
    <ellipse cx="88" cy="136" rx="13" ry="9" transform="rotate(-10 88 136)"/>
  </g>
  <g stroke="#7a5030" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M64 96 Q72 100 80 104" transform="rotate(-25 72 100)"/>
    <path d="M96 108 Q104 112 112 116" transform="rotate(15 104 112)"/>
    <path d="M80 132 Q88 136 96 140" transform="rotate(-10 88 136)"/>
  </g>
</svg>