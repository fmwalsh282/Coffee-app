<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#2b1a12"/>
      <stop offset="0.55" stop-color="#42281a"/>
      <stop offset="1" stop-color="#5c3a22"/>
    </linearGradient>

    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8836b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e8836b" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>

  <g filter="url(#softer)">
    <circle cx="1180" cy="220" r="260" fill="url(#glowAmber)"/>
    <circle cx="260" cy="150" r="200" fill="url(#glowRose)"/>
    <circle cx="1420" cy="620" r="220" fill="url(#glowGold)"/>
    <circle cx="60" cy="700" r="180" fill="url(#glowAmber)"/>
  </g>

  <g filter="url(#soft)" opacity="0.8">
    <circle cx="980" cy="360" r="70" fill="url(#glowGold)"/>
    <circle cx="1300" cy="420" r="55" fill="url(#glowRose)"/>
    <circle cx="420" cy="500" r="60" fill="url(#glowAmber)"/>
    <circle cx="760" cy="650" r="45" fill="url(#glowGold)"/>
    <circle cx="1500" cy="180" r="50" fill="url(#glowGold)"/>
  </g>

  <g opacity="0.35" stroke="#ffe3b3" stroke-width="1">
    <line x1="200" y1="0" x2="150" y2="900"/>
    <line x1="520" y1="0" x2="480" y2="900"/>
    <line x1="900" y1="0" x2="850" y2="900"/>
    <line x1="1240" y1="0" x2="1200" y2="900"/>
  </g>

  <rect width="1600" height="900" fill="#1a0f09" opacity="0.25"/>
</svg>
