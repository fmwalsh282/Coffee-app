<svg viewBox="0 0 1600 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b1a12"/>
      <stop offset="0.55" stop-color="#3f2618"/>
      <stop offset="1" stop-color="#54341f"/>
    </linearGradient>

    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8836b" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#e8836b" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#base)"/>

  <g filter="url(#soft)">
    <circle cx="140"  cy="120"  r="70" fill="url(#glowGold)"/>
    <circle cx="470"  cy="210"  r="55" fill="url(#glowRose)"/>
    <circle cx="830"  cy="150"  r="80" fill="url(#glowAmber)"/>
    <circle cx="1190" cy="240"  r="60" fill="url(#glowGold)"/>
    <circle cx="1480" cy="130"  r="65" fill="url(#glowRose)"/>

    <circle cx="260"  cy="470"  r="60" fill="url(#glowRose)"/>
    <circle cx="640"  cy="520"  r="75" fill="url(#glowAmber)"/>
    <circle cx="1010" cy="460"  r="55" fill="url(#glowGold)"/>
    <circle cx="1360" cy="540"  r="70" fill="url(#glowAmber)"/>

    <circle cx="120"  cy="800"  r="65" fill="url(#glowAmber)"/>
    <circle cx="500"  cy="850"  r="50" fill="url(#glowGold)"/>
    <circle cx="880"  cy="790"  r="70" fill="url(#glowRose)"/>
    <circle cx="1240" cy="860"  r="60" fill="url(#glowGold)"/>
    <circle cx="1520" cy="780"  r="55" fill="url(#glowAmber)"/>

    <circle cx="300"  cy="1120" r="55" fill="url(#glowGold)"/>
    <circle cx="700"  cy="1160" r="65" fill="url(#glowRose)"/>
    <circle cx="1080" cy="1100" r="70" fill="url(#glowAmber)"/>
    <circle cx="1440" cy="1170" r="50" fill="url(#glowGold)"/>

    <circle cx="160"  cy="1420" r="60" fill="url(#glowRose)"/>
    <circle cx="560"  cy="1460" r="70" fill="url(#glowAmber)"/>
    <circle cx="950"  cy="1410" r="55" fill="url(#glowGold)"/>
    <circle cx="1340" cy="1470" r="65" fill="url(#glowRose)"/>
  </g>

  <g opacity="0.25" stroke="#ffe3b3" stroke-width="1.5">
    <line x1="80"   y1="0" x2="0"    y2="1600"/>
    <line x1="380"  y1="0" x2="300"  y2="1600"/>
    <line x1="680"  y1="0" x2="600"  y2="1600"/>
    <line x1="980"  y1="0" x2="900"  y2="1600"/>
    <line x1="1280" y1="0" x2="1200" y2="1600"/>
    <line x1="1580" y1="0" x2="1500" y2="1600"/>
  </g>

  <rect width="1600" height="1600" fill="#1a0f09" opacity="0.3"/>
</svg>
